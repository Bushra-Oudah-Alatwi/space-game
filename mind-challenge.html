<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي العقل الذكي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
body{margin:0}

/* Layout: one challenge card at a time, progress pills on top, big tap targets for projector or phone */
:root{
  --bg:#fbeef5; --card:#ffffff; --fg:#3a1830; --muted:#8a5a74;
  --accent:#c93c7d; --accent2:#7a45d6; --soft:#f6d7e7; --ok:#1f9d63; --bad:#d64545;
  --display:"Lalezar","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1219; --card:#2c1a25; --fg:#fbe9f2; --muted:#c9a0b6; --accent:#f06fa9; --accent2:#a985f0; --soft:#43263a; --ok:#3ecf8a; --bad:#f07070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1219; --card:#2c1a25; --fg:#fbe9f2; --muted:#c9a0b6; --accent:#f06fa9; --accent2:#a985f0; --soft:#43263a; --ok:#3ecf8a; --bad:#f07070; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);margin:0;text-align:center;color:var(--accent);text-wrap:balance;line-height:1.2}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:10px;border-radius:6px;background:var(--soft)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.now{background:var(--accent2)}
.score{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 0 var(--soft)}
.skill{align-self:flex-start;background:var(--accent2);color:#fff;font-weight:800;padding:6px 16px;border-radius:30px;font-size:17px}
.q{font-size:clamp(22px,4.5vw,28px);font-weight:800;line-height:1.6;margin:0;text-wrap:balance}
.big{font-size:clamp(30px,8vw,46px);text-align:center;letter-spacing:4px;line-height:1.5;direction:ltr}
.grid-emoji{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:clamp(26px,7vw,38px);text-align:center;direction:ltr}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font-family:var(--body);cursor:pointer;border:none}
.opt{background:var(--soft);color:var(--fg);font-size:clamp(20px,4.5vw,26px);font-weight:800;padding:16px 10px;border-radius:18px;min-height:64px;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.opt.ok{background:var(--ok);color:#fff} .opt.bad{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{font-size:21px;font-weight:700;min-height:1.6em;margin:0}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.btn{background:var(--accent);color:#fff;font-size:22px;font-weight:800;padding:14px 28px;border-radius:40px;align-self:center}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.timer{font-family:var(--display);font-size:44px;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.sudoku{display:grid;grid-template-columns:repeat(4,1fr);gap:0;width:min(320px,100%);align-self:center;border:3px solid var(--fg);border-radius:10px;overflow:hidden;direction:ltr}
.cell{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;border:1px solid var(--muted);background:var(--card);color:var(--fg);font-family:var(--body);text-align:center;width:100%;box-sizing:border-box}
.cell.given{background:var(--soft)}
input.cell{color:var(--accent2)} input.cell.wrong{background:var(--bad);color:#fff}
.cell.br{border-right:3px solid var(--fg)} .cell.bb{border-bottom:3px solid var(--fg)}
.end{text-align:center;align-items:center}
.end .num{font-family:var(--display);font-size:80px;color:var(--accent);line-height:1}
.hint{color:var(--muted);font-size:18px;margin:0}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.opt{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <h1>تحدي العقل الذكي 🧠</h1>
  <div class="top"><div class="dots" id="dots"></div><div class="score" id="score">النقاط: 0</div></div>
  <div id="stage"></div>
</div>

<script>
const Q=[
 {skill:"التركيز والانتباه",type:"mc",q:"كم نجمة ⭐ في المربع؟ عدّيها بتركيز!",
  html:'<div class="grid-emoji">'+"⭐🌙☀️⭐🌙🌙☀️⭐🌙☀️☀️⭐🌙☀️⭐🌙⭐☀️🌙☀️⭐🌙☀️🌙".match(/(⭐|🌙|☀️)/gu).map(e=>"<span>"+e+"</span>").join("")+"</div>",
  opts:["5","6","7","8"],a:"7",why:"عدد النجوم 7"},
 {skill:"التفكير المنطقي",type:"mc",q:"ما الرقم التالي في السلسلة؟",html:'<div class="big">2 ، 4 ، 8 ، 16 ، ؟</div>',
  opts:["18","24","32","20"],a:"32",why:"كل رقم يتضاعف: 16 × 2 = 32"},
 {skill:"حل المشكلات",type:"mc",q:"مع سارة 20 ريالًا، اشترت عصيرًا بـ 3 ريالات وساندويتش بـ 5 ريالات. كم بقي معها؟",
  opts:["8","12","15","10"],a:"12",why:"20 − 3 − 5 = 12 ريالًا"},
 {skill:"قوة الذاكرة",type:"memory",show:["🍎","🚗","🐱","📚","⚽"],q:"أيّ رمز لم يظهر؟",
  opts:["🐱","🎈","📚","⚽"],a:"🎈",why:"البالون 🎈 لم يكن من الرموز"},
 {skill:"التخطيط المسبق",type:"mc",q:"تبدئين من الرقم 2. أي خطة توصلك إلى 10 بالضبط؟",
  opts:["× 2 ثم + 6","+ 2 ثم × 3","× 3 ثم + 2","+ 6 ثم × 2"],a:"× 2 ثم + 6",why:"2 × 2 = 4، ثم 4 + 6 = 10"},
 {skill:"سرعة البديهة",type:"timer",secs:10,q:"بسرعة! كم ناتج 7 × 8 ؟",
  opts:["54","56","63","48"],a:"56",why:"7 × 8 = 56"},
 {skill:"التفكير الإبداعي",type:"mc",q:"رتّبي الحروف لتكوين كلمة لها علاقة بالدرس:",html:'<div class="big">ر ي ك ف ت</div>',
  opts:["تفكير","كفيرت","فكرتي","ريكفت"],a:"تفكير",why:"الكلمة هي: تفكير"},
 {skill:"الصبر والمثابرة",type:"sudoku",q:"سودوكو صغير: املئي الخانات الفارغة بالأرقام 1 إلى 4، بدون تكرار في الصف أو العمود أو المربع.",
  sol:[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],blank:[[0,1],[1,2],[2,0],[2,2],[3,1],[3,3]]}
];
let i=0,score=0,res=[],tmr=null;
const $=s=>document.querySelector(s), stage=$("#stage");
function dots(){$("#dots").innerHTML=Q.map((_,k)=>`<span class="dot ${res[k]===true?'ok':res[k]===false?'bad':k===i?'now':''}"></span>`).join("");$("#score").textContent="النقاط: "+score+" / "+Q.length}
function finish(ok,q){res[i]=ok;if(ok)score++;dots();const fb=$("#fb");fb.className="fb "+(ok?"ok":"bad");fb.textContent=(ok?"أحسنتِ! ✅ ":"للأسف ❌ ")+q.why;
 const n=document.createElement("button");n.className="btn";n.id="next";n.textContent=i<Q.length-1?"التحدي التالي ←":"النتيجة 🏆";n.onclick=()=>{i++;render()};stage.querySelector(".card").appendChild(n);n.focus()}
function mcOpts(q){return `<div class="opts">${q.opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div><p class="fb" id="fb"></p>`}
function bindMC(q){stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{clearInterval(tmr);stage.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add("ok")});const ok=b.textContent===q.a;if(!ok)b.classList.add("bad");finish(ok,q)})}
function head(q){return `<span class="skill">${q.skill}</span><p class="q">${q.q}</p>`}
function render(){clearInterval(tmr);dots();
 if(i>=Q.length){const m=score>=7?"عقل ذهبي! 🌟":score>=5?"ممتاز، استمري! 💪":"تمرّني أكثر وستتحسنين 🧩";
  stage.innerHTML=`<div class="card end"><span class="skill" style="align-self:center">النتيجة النهائية</span><div class="num">${score} / ${Q.length}</div><p class="q">${m}</p><button class="btn" id="again">العبي مرة أخرى</button></div>`;
  $("#again").onclick=()=>{i=0;score=0;res=[];render()};return}
 const q=Q[i];
 if(q.type==="mc"){stage.innerHTML=`<div class="card">${head(q)}${q.html||""}${mcOpts(q)}</div>`;bindMC(q)}
 else if(q.type==="timer"){stage.innerHTML=`<div class="card">${head(q)}<div class="timer" id="t">${q.secs}</div>${mcOpts(q)}</div>`;bindMC(q);let s=q.secs;
  tmr=setInterval(()=>{s--;$("#t").textContent=s;if(s<=0){clearInterval(tmr);$("#t").textContent="انتهى الوقت ⏰";stage.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add("ok")});finish(false,q)}},1000)}
 else if(q.type==="memory"){stage.innerHTML=`<div class="card"><span class="skill">${q.skill}</span><p class="q">احفظي هذه الرموز جيدًا! ستختفي بعد <span id="t">5</span> ثوانٍ</p><div class="big">${q.show.join(" ")}</div><p class="hint">ركّزي…</p></div>`;let s=5;
  tmr=setInterval(()=>{s--;const t=$("#t");if(t)t.textContent=s;if(s<=0){clearInterval(tmr);stage.innerHTML=`<div class="card">${head(q)}<div class="big">❓ ❓ ❓ ❓ ❓</div>${mcOpts(q)}</div>`;bindMC(q)}},1000)}
 else if(q.type==="sudoku"){const isB=(r,c)=>q.blank.some(([a,b])=>a===r&&b===c);let g="";
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){const cls="cell"+(c===1?" br":"")+(r===1?" bb":"");
   g+=isB(r,c)?`<input class="${cls}" id="c${r}${c}" inputmode="numeric" maxlength="1" aria-label="صف ${r+1} عمود ${c+1}">`:`<div class="${cls} given">${q.sol[r][c]}</div>`}
  stage.innerHTML=`<div class="card">${head(q)}<div class="sudoku">${g}</div><p class="fb" id="fb"></p><div class="row" id="srow"><button class="btn" id="chk">تحقّقي</button><button class="btn ghost" id="give">إظهار الحل</button></div></div>`;
  let tries=0;
  $("#chk").onclick=()=>{let all=true;q.blank.forEach(([r,c])=>{const e=$("#c"+r+c);const v=e.value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));const ok=+v===q.sol[r][c];e.classList.toggle("wrong",!ok);if(!ok)all=false});tries++;
   if(all){$("#srow").remove();q.why="حللتِ السودوكو بعد "+tries+" محاولة";finish(true,q)}else{const fb=$("#fb");fb.className="fb bad";fb.textContent="بعض الخانات غير صحيحة، حاولي مرة أخرى 💪"}};
  $("#give").onclick=()=>{q.blank.forEach(([r,c])=>{const e=$("#c"+r+c);e.value=q.sol[r][c];e.classList.remove("wrong");e.disabled=true});$("#srow").remove();q.why="هذا هو الحل الصحيح";finish(false,q)}}
}
render();
</script>
</body>
</html>
